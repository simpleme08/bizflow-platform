services:
  - type: web
    name: bizflow-hris
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py check --deploy && python manage.py makemigrations --check --dry-run && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && if [ "$BIZFLOW_PROVISION_ACCOUNTS" = "true" ]; then python manage.py provision_production_accounts; fi && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /ready/
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_SSLMODE
        value: require
      - key: POSTGRES_CONN_MAX_AGE
        value: "60"
      - key: REDIS_URL
        sync: false
      - key: DJANGO_STORAGE
        value: s3
      - key: BIZFLOW_STORAGE_KEY
        sync: false
      - key: BIZFLOW_STORAGE_SECRET
        sync: false
      - key: BIZFLOW_STORAGE_BUCKET
        sync: false
      - key: BIZFLOW_STORAGE_ENDPOINT
        sync: false
      - key: BIZFLOW_STORAGE_REGION
        sync: false
      - key: BIZFLOW_STORAGE_ADDRESSING
        value: path
      - key: BIZFLOW_STORAGE_SIGNATURE
        value: s3v4
      - key: BIZFLOW_STORAGE_URL_TTL
        value: "300"
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: PAYMONGO_PUBLIC_KEY
        sync: false
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false
      - key: PAYMONGO_LIVEMODE
        value: "False"
      - key: PAYMONGO_PLAN_STARTER
        sync: false
      - key: PAYMONGO_PLAN_GROWTH
        sync: false
      - key: PAYMONGO_PLAN_BUSINESS
        sync: false
      - key: BIZFLOW_PROVISION_ACCOUNTS
        value: "true"
      - key: BIZFLOW_PROVISION_ON_WSGI
        value: "false"
      - key: BIZFLOW_PROVISION_DEMO_ON_WSGI
        value: "false"
      - key: BIZFLOW_PRODUCTION_DEMO_SEED
        value: "false"
      - key: BIZFLOW_DEMO_PASSWORD
        sync: false
      - key: BIZFLOW_DEMO_RESET_PASSWORDS
        value: "false"
      - key: BIZFLOW_PROVISION_RESET_PASSWORDS
        value: "false"
      - key: BIZFLOW_PRODUCTION_ORG_SLUG
        sync: false
      - key: BIZFLOW_PRODUCTION_ORG_NAME
        sync: false
      - key: BIZFLOW_PRODUCTION_HR_USERNAME
        sync: false
      - key: BIZFLOW_PRODUCTION_HR_PASSWORD
        sync: false
      - key: BIZFLOW_PRODUCTION_HR_EMAIL
        sync: false
      - key: BIZFLOW_PRODUCTION_HR_FIRST_NAME
        sync: false
      - key: BIZFLOW_PRODUCTION_HR_LAST_NAME
        sync: false
      - key: BIZFLOW_PRODUCTION_SME_USERNAME
        sync: false
      - key: BIZFLOW_PRODUCTION_SME_PASSWORD
        sync: false
      - key: BIZFLOW_PRODUCTION_SME_EMAIL
        sync: false
      - key: BIZFLOW_PRODUCTION_SME_FIRST_NAME
        sync: false
      - key: BIZFLOW_PRODUCTION_SME_LAST_NAME
        sync: false
      - key: BIZFLOW_PRODUCTION_SUPER_USER_USERNAME
        sync: false
      - key: BIZFLOW_PRODUCTION_SUPER_USER_PASSWORD
        sync: false
      - key: BIZFLOW_PRODUCTION_SUPER_USER_EMAIL
        sync: false
      - key: BIZFLOW_PRODUCTION_SUPER_USER_FIRST_NAME
        sync: false
      - key: BIZFLOW_PRODUCTION_SUPER_USER_LAST_NAME
        sync: false
