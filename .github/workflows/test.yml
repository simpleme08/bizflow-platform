name: Django tests

on:
  push:
    branches: [main, 'fix/**', 'feat/**', 'hardening/**', 'release/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bizflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d bizflow"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run migrations
        env:
          DJANGO_ENV: development
          DJANGO_SECRET_KEY: ci-test-secret
          DJANGO_DEBUG: '1'
          DB_ENGINE: postgresql
          POSTGRES_DB: bizflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
          POSTGRES_HOST: localhost
          POSTGRES_SSLMODE: disable
        run: python manage.py migrate --noinput
      - name: Run tests
        env:
          DJANGO_ENV: development
          DJANGO_SECRET_KEY: ci-test-secret
          DJANGO_DEBUG: '1'
          DB_ENGINE: postgresql
          POSTGRES_DB: bizflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
          POSTGRES_HOST: localhost
          POSTGRES_SSLMODE: disable
        run: python manage.py test
      - name: Run production deployment checks
        env:
          DJANGO_ENV: production
          DJANGO_SECRET_KEY: ci-production-check-secret
          DJANGO_DEBUG: '0'
          DJANGO_ALLOWED_HOSTS: app.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://app.example.com
          DB_ENGINE: postgresql
          POSTGRES_DB: bizflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
          POSTGRES_HOST: localhost
          POSTGRES_SSLMODE: disable
          REDIS_URL: redis://localhost:6379/0
          DJANGO_STORAGE: s3
          BIZFLOW_STORAGE_KEY: ci-storage-key
          BIZFLOW_STORAGE_SECRET: ci-storage-secret
          BIZFLOW_STORAGE_BUCKET: bizflow-ci
          BIZFLOW_STORAGE_ENDPOINT: https://storage.example.com
          BIZFLOW_STORAGE_REGION: ap-southeast-1
        run: python manage.py check --deploy
      - name: Verify production cache connectivity
        env:
          DJANGO_ENV: production
          DJANGO_SECRET_KEY: ci-production-check-secret
          DJANGO_DEBUG: '0'
          DJANGO_ALLOWED_HOSTS: app.example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://app.example.com
          DB_ENGINE: postgresql
          POSTGRES_DB: bizflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
          POSTGRES_HOST: localhost
          POSTGRES_SSLMODE: disable
          REDIS_URL: redis://localhost:6379/0
          DJANGO_STORAGE: s3
          BIZFLOW_STORAGE_KEY: ci-storage-key
          BIZFLOW_STORAGE_SECRET: ci-storage-secret
          BIZFLOW_STORAGE_BUCKET: bizflow-ci
          BIZFLOW_STORAGE_ENDPOINT: https://storage.example.com
          BIZFLOW_STORAGE_REGION: ap-southeast-1
        run: python manage.py shell -c "from django.core.cache import cache; cache.set('ci-production-cache-check', 'ok', 30); assert cache.get('ci-production-cache-check') == 'ok'"
