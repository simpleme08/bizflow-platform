<!doctype html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/static/adminlte/plugins/fontawesome-free/css/all.min.css"><link rel="stylesheet" href="/static/adminlte/dist/css/adminlte.min.css"><link rel="stylesheet" href="/static/css/custom.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Login | BizFlow HRIS</title>
    <style>
        :root { font-family: Arial, sans-serif; color: #17221d; background: #eef2ed; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #eef2ed, #dfe9df); }
        main { width: min(430px, calc(100% - 32px)); padding: 38px; background: #fffdf8; border: 1px solid #cfd9cf; box-shadow: 10px 10px 0 #cbd9ca; }
        .brand { color: #1e4f35; font: 700 13px Georgia, serif; letter-spacing: 2px; text-transform: uppercase; }
        h1 { margin: 28px 0 8px; font: 500 40px Georgia, serif; }
        p { color: #637067; font-size: 15px; line-height: 1.5; }
        label { display: block; margin: 20px 0 7px; color: #637067; font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
        input { width: 100%; padding: 14px; border: 1px solid #b9c2b8; background: #f7f8f3; font-size: 16px; }
        button { width: 100%; margin-top: 25px; padding: 15px; border: 0; background: #1e4f35; color: white; font-weight: 700; cursor: pointer; }
        .error { margin-top: 18px; color: #a0382f; font-size: 14px; }
        .clock { display: block; margin-top: 24px; color: #1e4f35; font-size: 13px; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <div class="brand">BizFlow HRIS · Employee Access</div>
        <h1>Clock in.</h1>
        <p>Sign in with your employee account to record time and view your self-service workspace.</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="post">
            {% csrf_token %}
            <label for="id_username">Username</label>
            <input id="id_username" name="username" type="text" autocomplete="username" required autofocus>
            <label for="id_password">Password</label>
            <input id="id_password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Continue to time clock</button>
        </form>
        <a class="clock" href="/clock/">Open shared clock</a>
    </main>
</body>
</html>
