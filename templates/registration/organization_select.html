<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Choose organization | HRIS</title></head>
<body>
<main>
<h1>Choose organization</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<p>Your account has access to more than one organization. Choose where you want to sign in.</p>
<form method="post">{% csrf_token %}
<input type="hidden" name="username" value="{{ username }}">
<input type="hidden" name="password" value="{{ password }}">
{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
<label for="id_organization">Organization</label>
<select id="id_organization" name="organization_id" required>
<option value="">Select an organization</option>
{% for membership in organizations %}<option value="{{ membership.organization_id }}">{{ membership.organization.name }}</option>{% endfor %}
</select>
<button type="submit">Continue</button>
</form>
</main>
</body>
</html>
