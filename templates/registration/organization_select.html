<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Select organization | HRIS</title>
    <style>
        body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f7fb;color:#102a5c}
        main{width:min(460px,calc(100% - 32px));background:#fff;padding:30px;border-radius:18px;box-shadow:0 18px 55px rgba(16,42,92,.12)}
        h1{margin:0 0 8px;font-size:1.5rem}.muted{color:#617492;margin:0 0 22px;font-size:.9rem}
        .error{background:#fff1f2;color:#be123c;padding:10px;border-radius:9px;margin-bottom:15px}
        button{width:100%;padding:13px;margin-top:9px;border:1px solid #cbd8e8;border-radius:10px;background:#fff;text-align:left;font-weight:750;cursor:pointer}
        button:hover{border-color:#0876e8;background:#f5faff}
        .logout{display:block;margin-top:18px;text-align:center;color:#0876e8;text-decoration:none;font-size:.85rem;font-weight:700}
    </style>
</head>
<body>
<main>
    <h1>Select your organization</h1>
    <p class="muted">Choose the organization you want to access for this session.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
        {% csrf_token %}
        {% for membership in organizations %}
            <button type="submit" name="organization_id" value="{{ membership.organization_id }}">{{ membership.organization.name }}</button>
        {% endfor %}
    </form>
    <a class="logout" href="/logout/">Sign out</a>
</main>
</body>
</html>
