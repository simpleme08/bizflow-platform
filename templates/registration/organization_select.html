<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Select workspace | BizFlow HRIS</title>
<style>
:root{--ink:#071322;--muted:#68798f;--blue:#1478d4;--line:#dfe7f0}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 15% 10%,rgba(103,217,255,.15),transparent 28%),linear-gradient(135deg,#050b16,#0c2444);display:grid;place-items:center;padding:20px;color:var(--ink)}main{width:min(500px,100%);background:#fff;border-radius:23px;padding:32px;box-shadow:0 30px 85px rgba(0,0,0,.3)}.brand{color:#071322;font-size:1.1rem;font-weight:950;letter-spacing:-.04em}.label{margin-top:30px;color:var(--blue);text-transform:uppercase;letter-spacing:.15em;font-size:.57rem;font-weight:950}h1{margin:9px 0 8px;font-size:2rem;line-height:1;letter-spacing:-.055em}.muted{color:var(--muted);font-size:.73rem;line-height:1.6;margin:0 0 20px}.error{background:#fff1f2;color:#be123c;padding:10px 12px;border-radius:9px;margin-bottom:14px;font-size:.7rem}.choice{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;color:var(--ink);font:inherit;font-size:.72rem;font-weight:900;cursor:pointer}.choice:hover,.choice:focus{border-color:#a9d0ef;background:#f6fbff;outline:none}.choice span:last-child{color:var(--blue);font-size:.6rem}.logout{display:block;margin-top:19px;text-align:center;color:var(--muted);text-decoration:none;font-size:.62rem;font-weight:800}.logout:hover{color:var(--blue)}
</style></head>
<body><main><div class="brand">BizFlow HRIS</div><div class="label">Workspace selection</div><h1>Choose your organization.</h1><p class="muted">You have access to more than one organization. Select the workspace you want to use for this session.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}{% for membership in organizations %}<button class="choice" type="submit" name="organization_id" value="{{ membership.organization_id }}"><span>{{ membership.organization.name }}</span><span>Enter →</span></button>{% endfor %}</form><a class="logout" href="/logout/">Sign out</a></main></body></html>
