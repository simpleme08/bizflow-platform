<!doctype html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/static/adminlte/plugins/fontawesome-free/css/all.min.css"><link rel="stylesheet" href="/static/adminlte/dist/css/adminlte.min.css"><link rel="stylesheet" href="/static/css/custom.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | BizFlow HRIS</title>
    <style>
        :root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; color: #1a1a1a; background: #f5f5f5; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .login-container { width: min(420px, calc(100% - 40px)); }
        header { text-align: center; margin-bottom: 3rem; }
        .brand { font-size: 1.3rem; font-weight: 700; color: #0066cc; }
        h1 { font-size: 1.8rem; font-weight: 700; margin: 1rem 0 0; }
        .subtitle { color: #666; font-size: 0.95rem; margin: 0.5rem 0 0; }
        main { background: white; padding: 2.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.5rem; color: #1a1a1a; }
        input { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; }
        input:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1); }
        button { width: 100%; padding: 0.75rem; background: #0066cc; color: white; border: none; border-radius: 4px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
        button:hover { background: #0052a3; }
        .error { background: #fee; color: #c33; padding: 0.75rem; border-radius: 4px; margin-bottom: 1.5rem; font-size: 0.95rem; }
        .footer-links { text-align: center; margin-top: 1.5rem; font-size: 0.9rem; }
        .footer-links a { color: #0066cc; text-decoration: none; }
        .footer-links a:hover { text-decoration: underline; }
        @media (max-width: 600px) {
            header { margin-bottom: 2rem; }
            h1 { font-size: 1.5rem; }
            main { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <header>
            <div class="brand">BizFlow</div>
            <h1>Sign in</h1>
            <p class="subtitle">Access your HRIS workspace</p>
        </header>
        
        <main>
            {% if error %}<div class="error">{{ error }}</div>{% endif %}
            
            <form method="post">
                {% csrf_token %}
                {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                
                <div class="form-group">
                    <label for="id_username">Username</label>
                    <input id="id_username" name="username" type="text" autocomplete="username" required autofocus>
                </div>
                
                <div class="form-group">
                    <label for="id_password">Password</label>
                    <input id="id_password" name="password" type="password" autocomplete="current-password" required>
                </div>
                
                <button type="submit">Sign in</button>
            </form>
            
            <div class="footer-links">
                <a href="/clock/">→ Use time clock instead</a>
            </div>
        </main>
    </div>
</body>
</html>
