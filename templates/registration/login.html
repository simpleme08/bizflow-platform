<!doctype html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/static/adminlte/plugins/fontawesome-free/css/all.min.css"><link rel="stylesheet" href="/static/adminlte/dist/css/adminlte.min.css"><link rel="stylesheet" href="/static/css/custom.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | BizFlow HRIS</title>
    <style>
        :root { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #0f172a; background: #f0f9ff; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: radial-gradient(circle at 15% 15%, rgba(34,211,238,.18), transparent 30%), linear-gradient(135deg,#082f49,#0ea5e9); }
        .login-container { width: min(430px, calc(100% - 40px)); }
        header { text-align: center; margin-bottom: 2rem; color: white; }
        .brand { display: inline-flex; align-items: center; gap: 10px; font-size: 1.3rem; font-weight: 800; }
        .brand::before { content: 'HS'; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: linear-gradient(135deg,#0ea5e9,#22d3ee); font-size: .8rem; }
        h1 { font-size: 1.9rem; font-weight: 800; margin: 1.1rem 0 0; letter-spacing: -.04em; }
        .subtitle { color: #dbeafe; font-size: .95rem; margin: .5rem 0 0; }
        main { background: white; padding: 2.5rem; border-radius: 20px; box-shadow: 0 28px 70px rgba(2,20,35,.25); border: 1px solid rgba(255,255,255,.5); }
        .form-group { margin-bottom: 1.35rem; }
        label { display: block; font-weight: 700; font-size: .88rem; margin-bottom: .5rem; color: #334155; }
        input { width: 100%; padding: .85rem .9rem; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 1rem; }
        input:focus { outline: none; border-color: #0ea5e9; box-shadow: 0 0 0 4px rgba(14,165,233,.12); }
        button { width: 100%; padding: .85rem; background: #0ea5e9; color: white; border: none; border-radius: 10px; font-size: 1rem; font-weight: 800; cursor: pointer; margin-top: .5rem; }
        button:hover { background: #0284c7; }
        .error { background: #fff1f2; color: #be123c; padding: .8rem; border-radius: 10px; margin-bottom: 1.5rem; font-size: .92rem; }
        .footer-links { text-align: center; margin-top: 1.4rem; font-size: .88rem; }
        .footer-links a { color: #0284c7; text-decoration: none; font-weight: 700; }
        .footer-links a:hover { text-decoration: underline; }
        @media (max-width: 600px) { main { padding: 1.5rem; } }
    </style>
</head>
<body>
    <div class="login-container">
        <header>
            <div class="brand">BizFlow HRIS</div>
            <h1>Sign in</h1>
            <p class="subtitle">Secure access to your HR and employee workspace</p>
        </header>
        <main>
            {% if error %}<div class="error">{{ error }}</div>{% endif %}
            <form method="post">
                {% csrf_token %}
                {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
                <div class="form-group"><label for="id_username">Username</label><input id="id_username" name="username" type="text" autocomplete="username" required autofocus></div>
                <div class="form-group"><label for="id_password">Password</label><input id="id_password" name="password" type="password" autocomplete="current-password" required></div>
                <button type="submit">Sign in to HRIS</button>
            </form>
            <div class="footer-links"><a href="/clock/">→ Use employee time clock</a></div>
        </main>
    </div>
</body>
</html>
