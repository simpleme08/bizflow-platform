<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payroll | BizFlow HRIS</title>
<link rel="stylesheet" href="/static/adminlte/plugins/fontawesome-free/css/all.min.css"><link rel="stylesheet" href="/static/css/custom.css">
<style>
:root{--ink:#0a1424;--muted:#68788d;--night:#07101d;--night2:#0c1a2b;--blue:#167dc1;--cyan:#3da9e8;--soft:#f4f7fa;--line:#dbe5ee;--green:#16835a;--red:#be123c;--shadow:0 14px 45px rgba(8,24,42,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.topbar{min-height:68px;background:linear-gradient(135deg,var(--night),var(--night2));color:#fff;display:flex;align-items:center}.topbar-inner{width:min(1380px,calc(100% - 36px));margin:auto;display:flex;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:900;letter-spacing:-.04em}.mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#64d9ff,#8077ff);color:#07111f}.nav{display:flex;gap:4px;margin-left:10px}.nav a{color:#aebed1;text-decoration:none;padding:9px 11px;border-radius:9px;font-size:.72rem;font-weight:800}.nav a:hover,.nav a.active{color:#fff;background:rgba(255,255,255,.08)}.spacer{flex:1}.user{font-size:.7rem;color:#dce8f5}.shell{width:min(1180px,calc(100% - 36px));margin:auto;padding:30px 0 56px}.back{color:#52677e;text-decoration:none;font-size:.72rem;font-weight:800}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:18px 0 24px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.59rem;font-weight:900;color:var(--blue)}h1{font-size:clamp(2rem,4vw,3rem);line-height:.98;letter-spacing:-.065em;margin:7px 0 9px}.subtitle{margin:0;color:var(--muted);font-size:.82rem;line-height:1.6}.role{padding:9px 12px;border-radius:999px;background:#eaf6ff;color:#126dbb;font-size:.66rem;font-weight:900}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:18px}.stat-label{display:block;color:var(--muted);font-size:.64rem;font-weight:750}.stat-value{display:block;margin-top:5px;font-size:1.65rem;font-weight:850;letter-spacing:-.05em}.panel{overflow:hidden}.head{display:flex;justify-content:space-between;align-items:center;padding:19px 20px;border-bottom:1px solid var(--line)}.head h2{margin:0;font-size:.94rem}.head span{color:var(--muted);font-size:.62rem}.body{padding:18px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:.7rem}.table th{background:#eef4f8;color:#344d67;text-align:left;font-size:.62rem;font-weight:850;padding:11px 12px;white-space:nowrap}.table td{padding:12px;border-bottom:1px solid #edf1f5;vertical-align:middle}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:.59rem;font-weight:900}.approved,.paid{background:#ecfaf3;color:#176b45}.draft{background:#f0f3f6;color:#52677e}.empty{text-align:center;padding:32px;color:var(--muted)}.btn{border:0;border-radius:8px;padding:7px 10px;font-size:.62rem;font-weight:850;text-decoration:none;background:#f1f5f8;color:#344d67}.btn-primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff}.notice{padding:11px 13px;border-radius:10px;background:#eaf6ff;color:#126dbb;font-size:.66rem;margin-bottom:14px}@media(max-width:950px){.nav{display:none}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.topbar-inner,.shell{width:calc(100% - 24px)}.hero{display:block}.role{display:inline-block;margin-top:14px}.stats{grid-template-columns:1fr 1fr}.table{min-width:850px}}
</style></head>
<body><header class="topbar"><div class="topbar-inner"><a class="brand" href="/workspace/"><span class="mark"><i class="fas fa-wallet"></i></span>BizFlow</a><nav class="nav"><a href="/workspace/">Workspace</a><a href="/employees/">People</a><a href="/attendance/">Attendance</a><a href="/leave/">Leave</a><a class="active" href="/payroll/">Payroll</a><a href="/reports/">Reports</a></nav><span class="spacer"></span><span class="user" id="user">Loading…</span></div></header>
<main class="shell"><a class="back" href="/workspace/"><i class="fas fa-arrow-left"></i> Back to workspace</a>
<section class="hero"><div><div class="eyebrow">Compensation</div><h1 id="title">Payroll</h1><p class="subtitle" id="subtitle">Approved payroll records and payslips in one workspace.</p></div><span class="role" id="role">Loading…</span></section>
<section class="stats"><article class="stat"><span class="stat-label">Records</span><b class="stat-value" id="count">—</b></article><article class="stat"><span class="stat-label">Gross pay</span><b class="stat-value" id="gross">—</b></article><article class="stat"><span class="stat-label">Deductions</span><b class="stat-value" id="deductions">—</b></article><article class="stat"><span class="stat-label">Net pay</span><b class="stat-value" id="net">—</b></article></section>
<section class="panel"><div class="head"><div><h2 id="listTitle">Payroll history</h2><span id="hint">Approved / paid only</span></div><div id="actions"></div></div><div class="body"><div class="notice" id="notice">Loading payroll data…</div><div id="periods" style="display:none;margin-bottom:14px"></div><div class="table-wrap"><table class="table"><thead id="thead"></thead><tbody id="rows"></tbody></table></div></div></section></main>
<script>
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])), money=v=>'PHP '+Number(v||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
async function get(url){const r=await fetch(url,{credentials:'same-origin'});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.detail||('Request failed ('+r.status+')'));e.status=r.status;throw e}return d}
let currentData=null;
function csrf(){const el=document.querySelector('[name=csrfmiddlewaretoken]');return el?el.value:''}
async function post(url,body){const r=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded','X-CSRFToken':csrf()},body:new URLSearchParams(body||{})});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.detail||('Request failed ('+r.status+')'));e.status=r.status;throw e}return d}
function periodFor(id){return (currentData.periods||[]).find(p=>p.id===id)}
function renderPeriods(d){const periods=d.periods||[];if(!periods.length)return;$('periods').style.display='block';$('periods').innerHTML='<label style="display:block;font-size:.62rem;font-weight:850;color:#52677e;margin-bottom:6px">Pay period</label><select id="periodSelect" style="padding:9px 11px;border:1px solid #dbe5ee;border-radius:8px;min-width:320px;font-size:.7rem">'+periods.map(p=>'<option value="'+esc(p.id)+'">'+esc(p.name)+' · '+esc(p.status)+'</option>').join('')+'</select>';$('periodSelect').onchange=renderActions}
function renderActions(){const d=currentData,p=periodFor($('periodSelect')?.value);if(!p){$('actions').innerHTML='';return}let html='';if(d.permissions?.manage_payroll&&p.status==='OPEN')html+='<button class="btn btn-primary" onclick="runPreflight(\''+esc(p.id)+'\')">Preflight</button> <button class="btn btn-primary" onclick="processPeriod(\''+esc(p.id)+'\')">Process payroll</button>';if(p.status==='CALCULATED')html+='<span class="badge draft">Confidence: '+esc(p.confidence)+'</span>';$('actions').innerHTML=html}
function render(d,hr){currentData=d;const records=d.records||[];$('count').textContent=records.length;$('gross').textContent=money(records.reduce((n,x)=>n+Number(x.gross_pay||0),0));$('deductions').textContent=money(records.reduce((n,x)=>n+Number(x.total_deductions||0),0));$('net').textContent=money(records.reduce((n,x)=>n+Number(x.net_pay||0),0));$('thead').innerHTML='<tr><th>Employee</th><th>Period</th><th>Gross</th><th>Deductions</th><th>Net pay</th><th>Status</th><th>Action</th></tr>';$('rows').innerHTML=records.length?records.map(x=>{let action='';if(d.permissions?.approve_payroll&&x.status==='DRAFT')action='<button class="btn btn-primary" onclick="approveRecord(\''+x.id+'\')">Approve</button>';else if(d.permissions?.pay_payroll&&x.status==='APPROVED')action='<button class="btn btn-primary" onclick="payRecord(\''+x.id+'\')">Mark paid</button>';else if(x.status==='APPROVED'||x.status==='PAID')action='<a class="btn btn-primary" href="/api/payroll/'+esc(x.id)+'/payslip/" target="_blank">Payslip</a>';return '<tr><td><strong>'+esc(x.employee)+'</strong><br><small>'+esc(x.employee_number)+'</small></td><td>'+esc(x.period)+'</td><td>'+money(x.gross_pay)+'</td><td>'+money(x.total_deductions)+'</td><td><strong>'+money(x.net_pay)+'</strong></td><td><span class="badge '+String(x.status).toLowerCase()+'">'+esc(x.status)+'</span></td><td>'+action+'</td></tr>}).join(''):'<tr><td colspan="7" class="empty">No payroll records are available for this account yet.</td></tr>';renderPeriods(d);renderActions()}
async function refresh(){const d=await get('/api/payroll/');render(d,true);$('notice').textContent='Payroll actions are controlled by your organization role and payroll status.'}
async function runPreflight(id){try{const d=await post('/api/payroll/preflight/',{period_id:id});alert((d.ok?'Preflight passed.':'Preflight blocked.')+'\\n\\n'+(d.errors||[]).join('\\n')+'\\n'+(d.warnings||[]).join('\\n'))}catch(e){alert(e.message)}}
async function processPeriod(id){if(!confirm('Process this open payroll period?'))return;try{const d=await post('/api/payroll/process/',{period_id:id});alert('Payroll processed: '+d.processed+' records. Confidence: '+d.confidence);await refresh()}catch(e){alert(e.message)}}
async function approveRecord(id){if(!confirm('Approve this payroll record? The final record triggers period reconciliation.'))return;try{await post('/api/payroll/'+id+'/approve/');await refresh()}catch(e){alert(e.message)}}
async function payRecord(id){if(!confirm('Mark this approved payroll record as paid?'))return;try{await post('/api/payroll/'+id+'/pay/');await refresh()}catch(e){alert(e.message)}}
async function boot(){try{const me=await get('/api/me/');$('user').textContent=me.username+' · '+me.organization.name;$('role').textContent=me.role_label;const hr=['HR','SUPER_USER','ADMIN','OWNER'].includes(me.role)||me.is_superuser;if(hr){$('title').textContent='Payroll management';$('subtitle').textContent='Review organization payroll records and payment status.';$('listTitle').textContent='Organization payroll';$('hint').textContent='Tenant-scoped payroll records';render(await get('/api/payroll/'),true)}else{render(await get('/api/payroll/me/'),false)}}catch(e){$('notice').textContent=e.message;if(e.status===401)location='/login/?next=/payroll/'}}
boot();
</script></body></html>
