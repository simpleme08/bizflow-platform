<!doctype html><html lang="en"><head><link rel="stylesheet" href="/static/adminlte/plugins/fontawesome-free/css/all.min.css"><link rel="stylesheet" href="/static/adminlte/dist/css/adminlte.min.css"><link rel="stylesheet" href="/static/css/custom.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Payroll | BizFlow HRIS</title></head><body class="hold-transition sidebar-mini"><header class="main-header navbar navbar-expand navbar-dark navbar-navy"><span class="navbar-brand">BizFlow HRIS</span></header><main class="content-wrapper p-4"><div class="content-header"><a href="{{ workspace_url }}"><i class="fas fa-arrow-left mr-1"></i>Workspace</a><h1 class="mt-3">My payroll</h1><p class="text-muted">Approved payroll history and printable payslips.</p></div><section class="card card-outline card-primary"><div class="card-header"><h3 class="card-title">Payroll history</h3></div><div class="card-body table-responsive p-0"><table class="table table-hover"><thead><tr><th>Period</th><th>Basic</th><th>Overtime</th><th>Gross</th><th>Deductions</th><th>Net pay</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="7" class="text-center p-4 text-muted">Loading approved payroll…</td></tr></tbody></table></div></section></main><script>fetch('/api/payroll/me/').then(async r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{rows.innerHTML=d.records.length?d.records.map(x=>`<tr><td>${x.period}<br><small class="text-muted">${x.period_start} – ${x.period_end}</small></td><td>PHP ${x.basic_pay}</td><td>PHP ${x.overtime_pay}</td><td>PHP ${x.gross_pay}</td><td>PHP ${x.total_deductions}</td><td><b>PHP ${x.net_pay}</b></td><td><a class="btn btn-sm btn-outline-primary" href="/api/payroll/${x.id}/payslip/" target="_blank"><i class="fas fa-print"></i> Payslip</a></td></tr>`).join(''):'<tr><td colspan="7" class="text-center p-4 text-muted">No approved payroll records yet.</td></tr>'}).catch(()=>{rows.innerHTML='<tr><td colspan="7" class="text-center p-4 text-muted">Payroll history is only available to an employee account.</td></tr>'})</script></body></html>
