<!DOCTYPE html>
<html lang="en">
<head>
  {% csrf_token %}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheduling | BizFlow HRIS</title>
  <link rel="stylesheet" href="/static/css/custom.css">
  <style>
    :root{--bg:#07111f;--panel:#0d1b2e;--line:#20334d;--text:#edf5ff;--muted:#8ea4bd;--accent:#67d8ff;--accent2:#9b7cff;--danger:#ff6b7a}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 15% 0%,#142a47 0,transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:1380px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:26px}.eyebrow{color:var(--accent);font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.title{font-size:clamp(1.8rem,4vw,3rem);margin:.25rem 0}.sub{color:var(--muted);margin:0}.back{color:var(--accent);text-decoration:none}
    .grid{display:grid;grid-template-columns:minmax(320px,.8fr) minmax(420px,1.2fr);gap:20px}.panel{background:linear-gradient(145deg,rgba(18,37,61,.94),rgba(9,21,37,.94));border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 18px 60px rgba(0,0,0,.25)}
    h2{margin-top:0}label{display:block;color:#c7d8ea;font-size:.85rem;font-weight:650;margin:14px 0 7px}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #2a405c;background:#081525;color:var(--text)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;gap:8px;align-items:center;margin:15px 0;color:var(--muted)}.check input{width:auto}
    button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.primary{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06101d}.danger{background:transparent;border:1px solid #65303a;color:#ff9da7}.muted{color:var(--muted)}.alert{padding:12px;border-radius:10px;margin-bottom:16px;display:none}.ok{background:#103b31;color:#a9f3d8}.err{background:#431f2a;color:#ffb5bf}.card{border:1px solid var(--line);border-radius:14px;padding:15px;margin:10px 0;background:rgba(4,13,25,.55)}.card-head{display:flex;justify-content:space-between;gap:12px}.badge{font-size:.72rem;padding:4px 8px;border-radius:999px;background:#17324f;color:#9edfff}.actions{display:flex;gap:8px;margin-top:12px}.empty{padding:30px;text-align:center;color:var(--muted)}
    @media(max-width:900px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<main>
  <div class="top"><div><div class="eyebrow">Workforce command center</div><h1 class="title">Shift scheduling</h1><p class="sub">Manage effective-dated assignments without weakening payroll or attendance controls.</p></div><a class="back" href="{{ workspace_url }}">← Workspace</a></div>
  <div id="alert" class="alert"></div>
  <div class="grid">
    <section class="panel">
      <h2>Assign a shift</h2>
      <form id="assignForm">
        <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
        <label>Employee<select id="employeeSelect" required><option value="">Choose employee</option></select></label>
        <label>Shift<select id="shiftSelect" required><option value="">Choose shift</option></select></label>
        <label>Client<select id="clientSelect"><option value="">No specific client</option></select></label>
        <label>Site<select id="siteSelect"><option value="">No specific site</option></select></label>
        <div class="row"><label>Start date<input type="date" id="startDate" required></label><label>End date<input type="date" id="endDate"></label></div>
        <label class="check"><input type="checkbox" id="isPrimary"> Set as primary assignment</label>
        <button class="primary" type="submit">Save assignment</button>
      </form>
    </section>
    <section class="panel"><h2>Current assignments</h2><div id="assignmentsList"><div class="empty">Select an employee.</div></div></section>
  </div>
</main>
<script>
const API='/api/scheduling';
const csrf=()=>document.querySelector('[name=csrfmiddlewaretoken]').value;
const alertBox=document.getElementById('alert');
function show(message,error=false){alertBox.textContent=message;alertBox.className='alert '+(error?'err':'ok');alertBox.style.display='block';setTimeout(()=>alertBox.style.display='none',4500)}
async function get(path){const r=await fetch(API+path,{headers:{Accept:'application/json'}});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Request failed');return d}
async function load(){try{const [e,s,c]=await Promise.all([get('/employees/'),get('/shifts/'),get('/clients/')]);const es=document.getElementById('employeeSelect'),ss=document.getElementById('shiftSelect'),cs=document.getElementById('clientSelect');e.employees.forEach(x=>{es.add(new Option(`${x.name} (${x.employee_number})`,x.id))});s.shifts.forEach(x=>{ss.add(new Option(`${x.name} · ${x.start_time}–${x.end_time}`,x.id))});window.clients=c.clients;c.clients.forEach(x=>cs.add(new Option(x.name,x.id)));}catch(e){show(e.message,true)}}
document.getElementById('clientSelect').addEventListener('change',e=>{const s=document.getElementById('siteSelect');s.innerHTML='<option value="">No specific site</option>';const c=(window.clients||[]).find(x=>x.id===e.target.value);(c?.sites||[]).forEach(x=>s.add(new Option(x.name,x.id)))})
document.getElementById('employeeSelect').addEventListener('change',async()=>{const id=document.getElementById('employeeSelect').value;if(!id)return;const d=new Date(),start=new Date(d),end=new Date(d);start.setDate(d.getDate()-30);end.setDate(d.getDate()+90);try{const x=await get(`/employee-schedule/?employee_id=${id}&start_date=${start.toISOString().slice(0,10)}&end_date=${end.toISOString().slice(0,10)}`);render(x.assignments)}catch(e){show(e.message,true)}})
function render(items){const box=document.getElementById('assignmentsList');if(!items.length){box.innerHTML='<div class="empty">No assignments in the selected window.</div>';return}box.innerHTML=items.map(a=>`<div class="card"><div class="card-head"><strong>${a.shift}</strong>${a.is_primary?'<span class="badge">Primary</span>':''}</div><div class="muted">${a.start_date} → ${a.end_date||'ongoing'}</div>${a.client?`<div class="muted">Client: ${a.client}${a.site?' · '+a.site:''}</div>`:''}<div class="actions"><button type="button" onclick="editAssignment('${a.id}')">Edit</button><button class="danger" type="button" onclick="deleteAssignment('${a.id}')">Delete</button></div></div>`).join('')}
window.editAssignment=async id=>{try{const e=document.getElementById('employeeSelect').value;const d=await get(`/employee-schedule/?employee_id=${e}&start_date=2000-01-01&end_date=2099-12-31`);const a=d.assignments.find(x=>x.id===id);if(!a)return;document.getElementById('shiftSelect').value=a.shift_id;document.getElementById('clientSelect').value=a.client_id||'';document.getElementById('clientSelect').dispatchEvent(new Event('change'));document.getElementById('siteSelect').value=a.site_id||'';document.getElementById('startDate').value=a.start_date;document.getElementById('endDate').value=a.end_date||'';document.getElementById('isPrimary').checked=!!a.is_primary;document.getElementById('assignForm').dataset.assignmentId=id}catch(e){show(e.message,true)}};
window.deleteAssignment=async id=>{if(!confirm('Delete this shift assignment?'))return;try{const r=await fetch(API+'/assign/',{method:'DELETE',headers:{'Content-Type':'application/json','X-CSRFToken':csrf(),Accept:'application/json'},body:JSON.stringify({assignment_id:id})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Delete failed');show(d.message);document.getElementById('employeeSelect').dispatchEvent(new Event('change'))}catch(e){show(e.message,true)}};
document.getElementById('assignForm').addEventListener('submit',async e=>{e.preventDefault();const p={employee_id:document.getElementById('employeeSelect').value,shift_id:document.getElementById('shiftSelect').value,client_id:document.getElementById('clientSelect').value||null,site_id:document.getElementById('siteSelect').value||null,start_date:document.getElementById('startDate').value,end_date:document.getElementById('endDate').value||null,is_primary:document.getElementById('isPrimary').checked};const id=e.target.dataset.assignmentId;if(id)p.assignment_id=id;try{const r=await fetch(API+'/assign/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf(),Accept:'application/json'},body:JSON.stringify(p)});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Save failed');show(d.message);delete e.target.dataset.assignmentId;document.getElementById('employeeSelect').dispatchEvent(new Event('change'))}catch(x){show(x.message,true)}});
load();
</script>
</body>
</html>
