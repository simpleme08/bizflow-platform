<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports | BizFlow HRIS</title><link rel="stylesheet" href="/static/adminlte/plugins/fontawesome-free/css/all.min.css"><link rel="stylesheet" href="/static/css/custom.css">
<style>
:root{--ink:#0a1424;--muted:#68788d;--night:#07101d;--night2:#0c1a2b;--blue:#167dc1;--cyan:#3da9e8;--soft:#f4f7fa;--line:#dbe5ee;--shadow:0 14px 45px rgba(8,24,42,.08)}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.topbar{min-height:68px;background:linear-gradient(135deg,var(--night),var(--night2));color:#fff;display:flex;align-items:center}.topbar-inner{width:min(1380px,calc(100% - 36px));margin:auto;display:flex;align-items:center;gap:18px}.brand{color:#fff;text-decoration:none;font-weight:900;letter-spacing:-.04em;display:flex;gap:10px;align-items:center}.mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#64d9ff,#8077ff);color:#07111f}.nav{display:flex;gap:4px;margin-left:10px}.nav a{color:#aebed1;text-decoration:none;padding:9px 11px;border-radius:9px;font-size:.72rem;font-weight:800}.nav a.active,.nav a:hover{color:#fff;background:rgba(255,255,255,.08)}.spacer{flex:1}.user{font-size:.7rem;color:#dce8f5}.shell{width:min(1180px,calc(100% - 36px));margin:auto;padding:30px 0 56px}.back{font-size:.72rem;font-weight:800;color:#52677e;text-decoration:none}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:18px 0 24px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.59rem;font-weight:900;color:var(--blue)}h1{font-size:clamp(2rem,4vw,3rem);line-height:.98;letter-spacing:-.065em;margin:7px 0 9px}.subtitle{color:var(--muted);font-size:.82rem;margin:0}.role{padding:9px 12px;border-radius:999px;background:#eaf6ff;color:#126dbb;font-size:.66rem;font-weight:900}.filters,.panel,.stat{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.filters{padding:15px;display:flex;gap:10px;align-items:end;margin-bottom:16px}.field{flex:1}.field label{display:block;color:#52677e;font-size:.62rem;font-weight:850;margin-bottom:5px}.field input{width:100%;border:1px solid #cbd8e4;border-radius:9px;padding:9px;font:inherit}.btn{border:0;border-radius:9px;padding:10px 14px;font-size:.65rem;font-weight:850;cursor:pointer}.btn-primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:16px}.stat{padding:18px}.stat-label{display:block;color:var(--muted);font-size:.64rem;font-weight:750}.stat-value{display:block;margin-top:5px;font-size:1.55rem;font-weight:850}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.panel{overflow:hidden}.head{padding:17px 19px;border-bottom:1px solid var(--line)}.head h2{margin:0;font-size:.9rem}.table{width:100%;border-collapse:collapse;font-size:.7rem}.table th,.table td{padding:11px 12px;border-bottom:1px solid #edf1f5}.table th{background:#eef4f8;text-align:left;color:#344d67;font-size:.62rem}.notice{padding:11px 13px;background:#eaf6ff;color:#126dbb;font-size:.66rem;border-radius:10px;margin-bottom:14px}.body{padding:0 0 4px}.exception{display:flex;justify-content:space-between;padding:13px 18px;border-bottom:1px solid #edf1f5;font-size:.68rem}.exception:last-child{border-bottom:0}.exception strong{font-size:.8rem}@media(max-width:800px){.nav{display:none}.stats,.grid{grid-template-columns:1fr 1fr}.filters{flex-wrap:wrap}.field{min-width:40%}}@media(max-width:560px){.topbar-inner,.shell{width:calc(100% - 24px)}.hero{display:block}.role{display:inline-block;margin-top:14px}.stats,.grid{grid-template-columns:1fr}}
</style></head>
<body><header class="topbar"><div class="topbar-inner"><a class="brand" href="/workspace/"><span class="mark"><i class="fas fa-chart-pie"></i></span>BizFlow</a><nav class="nav"><a href="/workspace/">Workspace</a><a href="/employees/">People</a><a href="/attendance/">Attendance</a><a href="/leave/">Leave</a><a href="/payroll/">Payroll</a><a class="active" href="/reports/">Reports</a></nav><span class="spacer"></span><span class="user" id="user">Loading…</span></div></header>
<main class="shell"><a class="back" href="/workspace/"><i class="fas fa-arrow-left"></i> Back to workspace</a><section class="hero"><div><div class="eyebrow">Insights</div><h1>Reports</h1><p class="subtitle">Operational summaries for attendance, leave, payroll, and exceptions.</p></div><span class="role" id="role">Loading…</span></section>
<form class="filters" id="filters"><div class="field"><label>Start date</label><input id="start" type="date"></div><div class="field"><label>End date</label><input id="end" type="date"></div><button class="btn btn-primary">Apply filters</button><button class="btn" type="button" id="clear">Clear</button></form>
<div class="stats"><article class="stat"><span class="stat-label">Attendance</span><b class="stat-value" id="attendance">—</b></article><article class="stat"><span class="stat-label">Leave requests</span><b class="stat-value" id="leave">—</b></article><article class="stat"><span class="stat-label">Payroll records</span><b class="stat-value" id="payroll">—</b></article><article class="stat"><span class="stat-label">Exceptions</span><b class="stat-value" id="exceptions">—</b></article></div>
<div class="grid"><section class="panel"><div class="head"><h2>Operational summary</h2></div><div class="body"><table class="table"><tbody id="summary"></tbody></table></div></section><section class="panel"><div class="head"><h2>Attention required</h2></div><div class="body" id="exceptionList"><div class="notice">Loading report data…</div></div></section></div></main>
<script>
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function load(){const q=new URLSearchParams();if($('start').value)q.set('start',$('start').value);if($('end').value)q.set('end',$('end').value);const r=await fetch('/api/reports/?'+q,{credentials:'same-origin'}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||('Request failed ('+r.status+')'));$('attendance').textContent=d.attendance.total;$('leave').textContent=d.leave.total;$('payroll').textContent=d.payroll.total_records;$('exceptions').textContent=Object.values(d.exceptions).filter(Boolean).length;$('summary').innerHTML='<tr><td>Present</td><td><strong>'+d.attendance.present+'</strong></td></tr><tr><td>Absent</td><td><strong>'+d.attendance.absent+'</strong></td></tr><tr><td>Late minutes</td><td><strong>'+d.attendance.late_minutes+'</strong></td></tr><tr><td>Overtime minutes</td><td><strong>'+d.attendance.overtime_minutes+'</strong></td></tr><tr><td>Pending leave</td><td><strong>'+d.leave.pending+'</strong></td></tr><tr><td>Approved leave</td><td><strong>'+d.leave.approved+'</strong></td></tr><tr><td>Approved payroll</td><td><strong>'+d.payroll.approved+'</strong></td></tr><tr><td>Paid payroll</td><td><strong>'+d.payroll.paid+'</strong></td></tr>';$('exceptionList').innerHTML='<div class="exception"><span>Open attendance punches</span><strong>'+d.exceptions.open_attendance_punches+'</strong></div><div class="exception"><span>Cover / unscheduled attendance</span><strong>'+d.exceptions.cover_or_unscheduled_attendance+'</strong></div><div class="exception"><span>Payroll review / blocked periods</span><strong>'+d.exceptions.payroll_review_or_blocked_periods+'</strong></div><div class="exception"><span>Billing attention</span><strong>'+((d.exceptions.billing_attention_required)?'Required':'Clear')+'</strong></div>'}
async function boot(){try{const r=await fetch('/api/me/');const me=await r.json();if(!r.ok)throw Error(me.detail||'Authentication required.');$('user').textContent=me.username+' · '+me.organization.name;$('role').textContent=me.role_label;await load()}catch(e){$('exceptionList').innerHTML='<div class="notice">'+esc(e.message)+'</div>';if(String(e.message).includes('Authentication'))location='/login/?next=/reports/'}}
$('filters').onsubmit=e=>{e.preventDefault();load().catch(err=>$('exceptionList').innerHTML='<div class="notice">'+esc(err.message)+'</div>')};$('clear').onclick=()=>{$('start').value='';$('end').value='';load()};boot();
</script></body></html>
