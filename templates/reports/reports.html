<!doctype html><html lang="en"><head><link rel="stylesheet" href="/static/adminlte/plugins/fontawesome-free/css/all.min.css"><link rel="stylesheet" href="/static/adminlte/dist/css/adminlte.min.css"><link rel="stylesheet" href="/static/css/custom.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports | BizFlow HRIS</title></head><body class="hold-transition sidebar-mini"><header class="main-header navbar navbar-expand navbar-dark navbar-navy"><span class="navbar-brand">BizFlow HRIS</span></header><main class="content-wrapper p-4"><div class="content-header"><a href="{{ workspace_url }}"><i class="fas fa-arrow-left mr-1"></i>Workspace</a><h1 class="mt-3">Reports</h1><p class="text-muted">Organization-level operational summaries.</p></div><div class="row" id="reports"><div class="col-12 text-muted">Loading reports…</div></div></main><script>fetch('/api/reports/').then(r=>r.json()).then(d=>{const c=document.getElementById('reports');const card=(title,icon,items)=>`<div class="col-lg-4"><article class="card card-outline card-primary"><div class="card-header"><h3 class="card-title"><i class="${icon} mr-2"></i>${title}</h3></div><div class="card-body p-0"><table class="table table-sm mb-0">${items.map(x=>`<tr><td>${x[0]}</td><td class="text-right"><b>${x[1]}</b></td></tr>`).join('')}</table></div></article></div>`;c.innerHTML=card('Attendance','fas fa-clock',[['Total',d.attendance.total],['Present',d.attendance.present],['Absent',d.attendance.absent],['Late minutes',d.attendance.late_minutes],['Overtime minutes',d.attendance.overtime_minutes]])+card('Leave','fas fa-calendar-alt',[['Applications',d.leave.total],['Pending',d.leave.pending],['Approved',d.leave.approved]])+card('Payroll','fas fa-money-check-alt',[['Records',d.payroll.total_records],['Approved',d.payroll.approved],['Paid',d.payroll.paid]])})</script></body></html>
