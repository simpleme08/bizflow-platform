<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onboarding | BizFlow HRIS</title><link rel="stylesheet" href="/static/adminlte/plugins/fontawesome-free/css/all.min.css"><link rel="stylesheet" href="/static/css/custom.css">
<style>
:root{--ink:#0a1424;--muted:#68788d;--night:#07101d;--night2:#0c1a2b;--blue:#167dc1;--cyan:#3da9e8;--soft:#f4f7fa;--line:#dbe5ee;--green:#16835a;--shadow:0 14px 45px rgba(8,24,42,.08)}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.topbar{min-height:68px;background:linear-gradient(135deg,var(--night),var(--night2));display:flex;align-items:center;color:#fff}.topbar-inner{width:min(1380px,calc(100% - 36px));margin:auto;display:flex;align-items:center;gap:18px}.brand{color:#fff;text-decoration:none;font-weight:900;display:flex;gap:10px;align-items:center}.mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#64d9ff,#8077ff);color:#07111f}.nav{display:flex;gap:4px;margin-left:10px}.nav a{color:#aebed1;text-decoration:none;padding:9px 11px;border-radius:9px;font-size:.72rem;font-weight:800}.nav a.active,.nav a:hover{color:#fff;background:rgba(255,255,255,.08)}.spacer{flex:1}.user{font-size:.7rem;color:#dce8f5}.shell{width:min(1180px,calc(100% - 36px));margin:auto;padding:30px 0 56px}.back{font-size:.72rem;font-weight:800;color:#52677e;text-decoration:none}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin:18px 0 24px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:.59rem;font-weight:900;color:var(--blue)}h1{font-size:clamp(2rem,4vw,3rem);line-height:.98;letter-spacing:-.065em;margin:7px 0 9px}.subtitle{margin:0;color:var(--muted);font-size:.82rem}.role{padding:9px 12px;border-radius:999px;background:#eaf6ff;color:#126dbb;font-size:.66rem;font-weight:900}.grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.head h2{margin:0;font-size:.92rem}.head span{font-size:.62rem;color:var(--muted)}.body{padding:18px}.field{margin-bottom:12px}.field label{display:block;font-size:.64rem;font-weight:850;color:#344d67;margin-bottom:5px}.control{width:100%;padding:9px;border:1px solid #cbd8e4;border-radius:9px;font:inherit;font-size:.72rem}.btn{border:0;border-radius:9px;padding:9px 12px;font-size:.64rem;font-weight:850;cursor:pointer}.btn-primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff}.record{border:1px solid var(--line);border-radius:13px;padding:15px;margin-bottom:10px;background:#fff}.record-head{display:flex;justify-content:space-between;gap:10px}.badge{padding:5px 9px;border-radius:999px;background:#eaf6ff;color:#126dbb;font-size:.58rem;font-weight:900;white-space:nowrap}.muted{color:var(--muted);font-size:.66rem;line-height:1.5}.task{margin-top:9px;padding:10px;border-radius:10px;background:#f6f9fb;border:1px solid #e5edf3;display:flex;justify-content:space-between;gap:10px;align-items:center}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #cbd8e4;border-radius:12px}.notice{padding:11px 13px;border-radius:10px;background:#eaf6ff;color:#126dbb;font-size:.66rem;margin-bottom:14px}@media(max-width:800px){.nav{display:none}.grid{grid-template-columns:1fr}}@media(max-width:560px){.topbar-inner,.shell{width:calc(100% - 24px)}.hero{display:block}.role{display:inline-block;margin-top:14px}}
</style></head>
<body>{% include "partials/app_nav.html" with active_page="onboarding" %}
<main class="shell"><a class="back" href="/workspace/"><i class="fas fa-arrow-left"></i> Back to workspace</a><section class="hero"><div><div class="eyebrow">Employee lifecycle</div><h1>Onboarding</h1><p class="subtitle">Create onboarding workflows, track required tasks, and close the new-hire journey.</p></div><span class="role" id="role">Loading…</span></section>
<div class="grid"><section class="panel"><div class="head"><h2>Create onboarding</h2><span>New hire</span></div><div class="body"><form id="form"><div class="field"><label>Employee</label><select id="employee" class="control" required><option value="">Select employee</option></select></div><div class="field"><label>Workflow</label><select id="workflow" class="control" required><option value="">Select workflow</option></select></div><div class="field"><label>Start date</label><input id="start" class="control" type="date" required></div><div class="field"><label>Expected completion</label><input id="expected" class="control" type="date" required></div><button class="btn btn-primary" style="width:100%">Create record</button><div id="message" class="muted"></div></form></div></section>
<section class="panel"><div class="head"><h2>Onboarding records</h2><span id="count">Loading…</span></div><div class="body"><div id="records"><div class="notice">Loading records…</div></div></div></section></div></main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function json(url,opt={}){const r=await fetch(url,{credentials:'same-origin',...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||('Request failed ('+r.status+')'));return d}
function render(d){const records=d.records||[];$('count').textContent=records.length+' record'+(records.length===1?'':'s');$('records').innerHTML=records.length?records.map(r=>'<article class="record"><div class="record-head"><div><strong>'+esc(r.employee)+'</strong><div class="muted">'+esc(r.employee_number)+' · '+esc(r.workflow)+'</div></div><span class="badge">'+esc(r.status)+'</span></div><div class="muted" style="margin-top:9px">Start '+esc(r.start_date||'—')+' · Expected '+esc(r.expected_completion_date||'—')+'</div><div>'+((r.tasks||[]).map(t=>'<div class="task"><div><strong style="font-size:.68rem">'+esc(t.title)+'</strong><div class="muted">'+esc(t.description||'')+' · Due '+esc(t.due_date||'—')+'</div></div>'+(t.status==='COMPLETED'?'<span class="badge">Complete</span>':'<button class="btn btn-primary" data-on="'+r.id+'" data-task="'+t.id+'">Complete</button>')+'</div>').join('')||'<div class="muted" style="margin-top:10px">No tasks assigned.</div>')+'</div></article>').join(''):'<div class="empty">No onboarding records yet.</div>';document.querySelectorAll('[data-task]').forEach(b=>b.onclick=async()=>{try{await json('/api/onboarding/'+b.dataset.on+'/tasks/'+b.dataset.task+'/',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'COMPLETED'})});await load()}catch(e){$('message').textContent=e.message}})}
async function load(){const d=await json('/api/onboarding/');render(d);if(!$('workflow').options.length||$('workflow').options.length===1)$('workflow').innerHTML='<option value="">Select workflow</option>'+(d.workflows||[]).map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('')}
async function boot(){try{const me=await json('/api/me/');$('user').textContent=me.username+' · '+me.organization.name;$('role').textContent=me.role_label;const e=await json('/api/employees/');$('employee').innerHTML='<option value="">Select employee</option>'+(e.employees||[]).map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+' ('+esc(x.employee_number)+')</option>').join('');$('start').valueAsDate=new Date();await load()}catch(e){$('message').textContent=e.message;if(e.message.includes('Authentication'))location='/login/?next=/onboarding/'}}
$('form').onsubmit=async ev=>{ev.preventDefault();try{await json('/api/onboarding/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({employee_id:$('employee').value,workflow_id:$('workflow').value,start_date:$('start').value,expected_completion_date:$('expected').value})});$('message').textContent='Onboarding record created.';ev.target.reset();await load()}catch(e){$('message').textContent=e.message}};boot();
</script></body></html>
