<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Onboarding | BizFlow HRIS</title>
<link rel="stylesheet" href="/static/adminlte/plugins/fontawesome-free/css/all.min.css"><link rel="stylesheet" href="/static/adminlte/dist/css/adminlte.min.css"><link rel="stylesheet" href="/static/css/custom.css"></head>
<body>
<header class="floot-topbar"><div class="floot-topbar-inner"><a class="floot-brand" href="/workspace/"><span class="floot-brand-mark"><i class="fas fa-users"></i></span>BizFlow</a><span style="flex:1"></span><a href="/workspace/" style="color:#dce8f5;font-size:.72rem;font-weight:800;text-decoration:none">Workspace</a></div></header>
<main class="floot-shell">
<a class="floot-back" href="/workspace/"><i class="fas fa-arrow-left"></i> Back to workspace</a>
<section class="floot-hero"><div><div class="floot-eyebrow">Employee lifecycle</div><h1>Onboarding</h1><p class="page-subtitle">Track new-hire tasks, status, and completion milestones.</p></div><span class="floot-status"><i class="fas fa-user-plus"></i> Onboarding</span></section>
<div class="floot-grid">
<section class="floot-panel"><div class="section-label" style="margin-top:0">Create record</div><form id="onboardingForm">
<div class="form-group"><label for="employeeSelect">Employee</label><select id="employeeSelect" class="form-control" required><option value="">Select employee</option></select></div>
<div class="form-group"><label for="workflowSelect">Workflow</label><select id="workflowSelect" class="form-control" required><option value="">Select onboarding workflow</option></select></div>
<div class="form-row"><div class="form-group col-6"><label for="startDate">Start date</label><input id="startDate" class="form-control" type="date" required></div><div class="form-group col-6"><label for="expectedDate">Expected completion</label><input id="expectedDate" class="form-control" type="date" required></div></div>
<button class="btn btn-primary" type="submit"><i class="fas fa-plus mr-1"></i>Create onboarding record</button>
</form></section>
<section class="floot-panel"><div class="section-label" style="margin-top:0">Current records</div><div id="records" class="floot-list"><div class="floot-empty">Loading onboarding records…</div></div></section>
</div>
</main>
<script>
const employeeSelect=document.getElementById('employeeSelect'),workflowSelect=document.getElementById('workflowSelect'),recordsContainer=document.getElementById('records');
async function fetchJson(url,options={}){const response=await fetch(url,options);if(!response.ok){const error=await response.json().catch(()=>({}));alert(error.detail||'Request failed.');return null}return response.json()}
function renderRecords(records){if(!records.length){recordsContainer.innerHTML='<div class="floot-empty">No onboarding records yet.</div>';return}recordsContainer.innerHTML=records.map(record=>'<div class="floot-list-item"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><strong>'+record.employee+' ('+record.employee_number+')</strong><span class="floot-status">'+record.status+'</span></div><p class="text-muted" style="margin:8px 0">Workflow: <strong>'+record.workflow+'</strong><br>Start: '+(record.start_date||'—')+' · Expected: '+(record.expected_completion_date||'—')+'</p><div class="floot-list">'+((record.tasks||[]).map(task=>'<div class="floot-list-item" style="background:#f8fafc"><div style="display:flex;justify-content:space-between;gap:12px"><strong>'+task.title+'</strong><span class="floot-status">'+task.status+'</span></div><p class="text-muted" style="margin:7px 0">'+(task.description||'')+'</p><small class="text-muted">Due: '+(task.due_date||'—')+'</small><br><button type="button" class="btn btn-primary btn-sm mt-2" data-task-id="'+task.id+'" data-onboarding-id="'+record.id+'">Mark complete</button></div>').join('')||'<div class="floot-empty">No tasks yet.</div>')+'</div></div>').join('');
recordsContainer.querySelectorAll('button[data-task-id]').forEach(button=>button.addEventListener('click',async()=>{await fetchJson('/api/onboarding/'+button.dataset.onboardingId+'/tasks/'+button.dataset.taskId+'/',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'COMPLETED'})});await loadRecords()}))}
async function loadEmployees(){const data=await fetchJson('/api/employees/');if(!data)return;employeeSelect.innerHTML='<option value="">Select employee</option>'+data.employees.map(employee=>'<option value="'+employee.id+'">'+employee.name+' ('+employee.employee_number+')</option>').join('')}
async function loadWorkflows(){const data=await fetchJson('/api/onboarding/');if(!data)return;workflowSelect.innerHTML='<option value="">Select onboarding workflow</option>'+(data.workflows||[]).map(workflow=>'<option value="'+workflow.id+'">'+workflow.name+'</option>').join('')}
async function loadRecords(){const data=await fetchJson('/api/onboarding/');if(!data)return;renderRecords(data.records||[])}
document.getElementById('onboardingForm').addEventListener('submit',async event=>{event.preventDefault();await fetchJson('/api/onboarding/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({employee_id:employeeSelect.value,workflow_id:workflowSelect.value,start_date:document.getElementById('startDate').value,expected_completion_date:document.getElementById('expectedDate').value})});await loadRecords();event.target.reset()});
document.getElementById('startDate').valueAsDate=new Date();loadEmployees();loadWorkflows();loadRecords();
</script>
</body></html>
