<!doctype html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/static/adminlte/plugins/fontawesome-free/css/all.min.css"><link rel="stylesheet" href="/static/adminlte/dist/css/adminlte.min.css"><link rel="stylesheet" href="/static/css/custom.css">
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Time Clock | HSIS HRIS</title>
    <style>
        :root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#102a5c;background:#062a63}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 76% 10%,rgba(24,201,239,.28),transparent 26%),radial-gradient(circle at 15% 85%,rgba(255,189,18,.2),transparent 20%),linear-gradient(135deg,#031b48,#0663bd 62%,#08a0df)}main{width:min(560px,calc(100% - 30px));padding:34px;background:#fff;border-radius:26px;box-shadow:0 30px 85px rgba(0,12,45,.3);text-align:center}.logo{width:64px;height:52px;position:relative;margin:0 auto 8px}.dot{position:absolute;border-radius:50%;box-shadow:0 2px 8px rgba(15,23,42,.15)}.d1{width:22px;height:22px;background:#ef1724;left:23px;top:0}.d2{width:19px;height:19px;background:#ffbd12;left:0;top:13px}.d3{width:19px;height:19px;background:#0876e8;left:25px;top:18px}.d4{width:16px;height:16px;background:#18b9bc;left:5px;top:31px}.d5{width:21px;height:21px;background:#55c51b;left:43px;top:24px}.d6{width:10px;height:10px;background:#e50083;left:27px;top:42px}.brand{font-size:1.55rem;font-weight:950;letter-spacing:-.06em;color:#062a63}.tagline{font-size:.58rem;color:#6a7b94;font-weight:800}.kicker{margin-top:27px;color:#0876e8;font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;font-weight:900}.clock{margin:7px 0 25px;color:#062a63;font-size:3rem;line-height:1;font-weight:900}.field{display:block;width:100%;margin:11px 0;padding:14px;border:1px solid #cbd8e8;border-radius:11px;background:#f8fbff;font-size:16px;text-align:center}.button{width:100%;padding:14px;margin-top:11px;border:0;border-radius:999px;background:#0876e8;color:#fff;font-size:15px;font-weight:900;cursor:pointer}.button.out{background:#062a63}.button:disabled{cursor:not-allowed;opacity:.45}.status{margin:17px 0 4px;color:#607391;font-size:14px}.last{color:#062a63;font-size:13px;font-weight:800}.error{min-height:20px;margin-top:15px;color:#be123c;font-size:14px}.back{display:inline-block;margin-top:22px;color:#0876e8;font-size:13px;font-weight:850;text-decoration:none}.hidden{display:none}.trust{display:flex;justify-content:center;gap:22px;margin-top:22px;padding-top:17px;border-top:1px solid #e4edf7;color:#6a7b94;font-size:.7rem}.trust strong{display:block;color:#163b72;font-size:.75rem}.camera{margin:18px auto 10px;border:1px solid #d8e5f2;border-radius:18px;padding:10px;background:#f5f9fd}.camera video{display:block;width:100%;max-height:310px;object-fit:cover;border-radius:12px;background:#061b3d;transform:scaleX(-1)}.camera-note{font-size:12px;color:#607391;margin:9px 0 0}.capture-state{font-size:12px;font-weight:800;color:#0876e8;margin-top:8px}.camera-button{margin-top:10px;padding:10px 16px;border:0;border-radius:999px;background:#18b9bc;color:#062a63;font-weight:900;cursor:pointer}.camera-button:disabled{opacity:.5;cursor:not-allowed}@media(max-width:600px){main{padding:24px}.clock{font-size:2.5rem}.camera video{max-height:260px}}
    </style>
</head>
<body><main>
<div class="logo"><i class="dot d1"></i><i class="dot d2"></i><i class="dot d3"></i><i class="dot d4"></i><i class="dot d5"></i><i class="dot d6"></i></div><div class="brand">HSIS</div><div class="tagline">HIGH SPEED INTERNET SUPPORT</div>
<div id="login-box"><div class="kicker">Employee time clock</div><div class="clock" id="clock">--:--:-- --</div><form id="login-form">{% csrf_token %}<input class="field" name="username" placeholder="Username" autocomplete="username" required><input class="field" name="password" placeholder="Password" type="password" autocomplete="current-password" required><button class="button" type="submit">Sign in &amp; continue</button></form></div>
<div id="clock-box" class="hidden"><div class="kicker">Philippine Standard Time</div><div class="clock" id="clock-auth">--:--:-- --</div><div class="status" id="employee"></div><div class="last" id="last-action"></div><div class="camera"><video id="camera" autoplay playsinline muted></video><div class="camera-note">A live camera photo is required for every Clock In and Clock Out.</div><button class="camera-button" id="camera-start" type="button">Enable camera</button><div class="capture-state" id="capture-state">Camera not ready</div></div><button class="button" id="clock-in" disabled>CLOCK IN — CAPTURE PHOTO</button><button class="button out" id="clock-out" disabled>CLOCK OUT — CAPTURE PHOTO</button></div>
<div class="error" id="error"></div><div class="trust"><div><strong>Secure</strong>Attendance record</div><div><strong>Photo proof</strong>Every clock action</div><div><strong>Accurate</strong>PH time</div></div><a class="back" href="/">← Back to website</a>
</main><canvas id="snapshot" class="hidden"></canvas>
<script>
const clock=document.getElementById('clock'),authClock=document.getElementById('clock-auth'),error=document.getElementById('error'),csrfToken=document.querySelector('[name=csrfmiddlewaretoken]').value,video=document.getElementById('camera'),snapshot=document.getElementById('snapshot'),cameraStart=document.getElementById('camera-start'),captureState=document.getElementById('capture-state');let cameraStream=null,currentState=null;
function tick(){const value=new Intl.DateTimeFormat('en-PH',{timeZone:'Asia/Manila',hour:'numeric',minute:'2-digit',second:'2-digit'}).format(new Date());clock.textContent=value;authClock.textContent=value}tick();setInterval(tick,1000);
async function readResponse(response){const text=await response.text();let data;try{data=JSON.parse(text)}catch(_){if(response.status===403)return {detail:'Security check failed. Refresh the page and sign in again.'};if(response.status>=500)return {detail:'The server encountered an error. Check the Django console for details.'};return {detail:'The server returned an unexpected response.'}}if(!response.ok)throw new Error(data.detail||'Unable to complete the request.');return data}
async function send(url,options){const response=await fetch(url,{...options,headers:{Accept:'application/json',...(options&&options.headers||{})}});return readResponse(response)}
function setAllowed(data){currentState=data;const i=document.getElementById('clock-in'),o=document.getElementById('clock-out');i.dataset.allowed=data.can_clock_in?'1':'';o.dataset.allowed=data.can_clock_out?'1':'';refreshButtons()}
function refreshButtons(){document.getElementById('clock-in').disabled=!cameraStream||document.getElementById('clock-in').dataset.allowed!=='1';document.getElementById('clock-out').disabled=!cameraStream||document.getElementById('clock-out').dataset.allowed!=='1'}
function showState(data){document.getElementById('login-box').classList.add('hidden');document.getElementById('clock-box').classList.remove('hidden');document.getElementById('employee').textContent=data.employee_name+(data.shift_name?` · ${data.shift_name}`:'');const action=data.last_action==='CLOCKED_IN'?'Clocked in':data.last_action==='CLOCKED_OUT'?'Clocked out':'No attendance action recorded yet';document.getElementById('last-action').textContent=data.last_action_at?`Last action: ${action} at ${new Date(data.last_action_at).toLocaleTimeString('en-PH',{timeZone:'Asia/Manila',hour:'numeric',minute:'2-digit'})}`:action;setAllowed(data);startCamera()}
async function startCamera(){if(cameraStream)return;error.textContent='';if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){error.textContent='This browser does not provide camera access. Use a modern browser over HTTPS or localhost.';return}try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'user'},width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=cameraStream;await video.play();captureState.textContent='Camera ready — photo required to clock';cameraStart.textContent='Camera ready';cameraStart.disabled=true;refreshButtons()}catch(exception){captureState.textContent='Camera permission is required';error.textContent='Camera access is required to clock in or clock out. Allow camera access and try again.'}}
async function capturePhoto(){if(!cameraStream||video.readyState<2)throw new Error('Camera is not ready. Enable the camera first.');const width=video.videoWidth||1280,height=video.videoHeight||720;snapshot.width=width;snapshot.height=height;const context=snapshot.getContext('2d');context.save();context.translate(width,0);context.scale(-1,1);context.drawImage(video,0,0,width,height);context.restore();return await new Promise(resolve=>snapshot.toBlob(resolve,'image/jpeg',0.85))}
document.getElementById('login-form').addEventListener('submit',async event=>{event.preventDefault();error.textContent='';const button=event.target.querySelector('button');button.disabled=true;try{const data=await send('/clock/login/',{method:'POST',body:new FormData(event.target)});showState(data)}catch(exception){error.textContent=exception.message}finally{button.disabled=false}});
async function action(value){error.textContent='';const buttons=[document.getElementById('clock-in'),document.getElementById('clock-out')];buttons.forEach(button=>button.disabled=true);try{captureState.textContent='Capturing photo…';const photo=await capturePhoto();if(!photo)throw new Error('Unable to capture a camera photo.');const form=new FormData();form.append('action',value);form.append('photo',photo,'clock-proof.jpg');const data=await send('/clock/action/',{method:'POST',headers:{'X-CSRFToken':csrfToken},body:form});captureState.textContent=value==='CLOCK_IN'?'Clock-in photo captured':'Clock-out photo captured';showState(data)}catch(exception){error.textContent=exception.message;captureState.textContent='Photo not captured';try{setAllowed(await send('/clock/action/',{method:'GET'}))}catch(_){}}}
cameraStart.onclick=startCamera;document.getElementById('clock-in').onclick=()=>action('CLOCK_IN');document.getElementById('clock-out').onclick=()=>action('CLOCK_OUT');fetch('/clock/action/',{headers:{Accept:'application/json'}}).then(readResponse).then(data=>{if(data&&data.employee_name)showState(data)}).catch(()=>{});window.addEventListener('beforeunload',()=>{if(cameraStream)cameraStream.getTracks().forEach(track=>track.stop())});
</script></body></html>
