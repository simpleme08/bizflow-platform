<!doctype html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/static/adminlte/plugins/fontawesome-free/css/all.min.css"><link rel="stylesheet" href="/static/adminlte/dist/css/adminlte.min.css"><link rel="stylesheet" href="/static/css/custom.css">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Time Clock | BizFlow HRIS</title>
    <style>
        :root { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #0f172a; background: #082f49; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 75% 15%, rgba(34,211,238,.28), transparent 30%), linear-gradient(135deg,#082f49,#0ea5e9); }
        main { width: min(510px, calc(100% - 32px)); padding: 36px; background: #fff; border: 1px solid rgba(255,255,255,.6); border-radius: 24px; box-shadow: 0 30px 80px rgba(2,20,35,.28); text-align: center; }
        .brand { color: #082f49; font: 800 13px Inter, sans-serif; letter-spacing: 1.4px; text-transform: uppercase; }
        .kicker { margin-top: 30px; color: #64748b; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; }
        .clock { margin: 8px 0 28px; color: #0ea5e9; font: 750 48px Inter, sans-serif; letter-spacing: -.04em; }
        .field { display: block; width: 100%; margin: 12px 0; padding: 14px; border: 1px solid #cbd5e1; border-radius: 10px; background: #f8fafc; font-size: 16px; text-align: center; }
        .field:focus { outline: none; border-color: #0ea5e9; box-shadow: 0 0 0 4px rgba(14,165,233,.12); }
        .button { width: 100%; padding: 15px; margin-top: 12px; border: 0; border-radius: 10px; background: #0ea5e9; color: #fff; font-size: 16px; font-weight: 800; cursor: pointer; }
        .button.out { background: #082f49; }
        .button:disabled { cursor: not-allowed; opacity: .45; }
        .status { margin: 18px 0 4px; color: #64748b; font-size: 14px; }
        .last { color: #082f49; font-size: 13px; font-weight: 700; }
        .error { min-height: 20px; margin-top: 16px; color: #be123c; font-size: 14px; }
        .back { display: inline-block; margin-top: 24px; color: #0284c7; font-size: 13px; font-weight: 800; text-decoration: none; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <main>
        <div class="brand">BizFlow HRIS · Time Clock</div>
        <div id="login-box">
            <div class="kicker">Sign in to record your attendance</div>
            <div class="clock" id="clock">--:--:-- --</div>
            <form id="login-form">
                {% csrf_token %}
                <input class="field" name="username" placeholder="username" autocomplete="username" required>
                <input class="field" name="password" placeholder="password" type="password" autocomplete="current-password" required>
                <button class="button" type="submit">Sign in</button>
            </form>
        </div>
        <div id="clock-box" class="hidden">
            <div class="kicker">Philippine Standard Time</div>
            <div class="clock" id="clock-auth">--:--:-- --</div>
            <div class="status" id="employee"></div>
            <div class="last" id="last-action"></div>
            <button class="button" id="clock-in">CLOCK IN</button>
            <button class="button out" id="clock-out">CLOCK OUT</button>
        </div>
        <div class="error" id="error"></div>
        <a class="back" href="{{ workspace_url }}">Back to workspace</a>
    </main>
    <script>
        const clock = document.getElementById('clock');
        const authClock = document.getElementById('clock-auth');
        const error = document.getElementById('error');
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
        function tick() {
            const value = new Intl.DateTimeFormat('en-PH', { timeZone: 'Asia/Manila', hour: 'numeric', minute: '2-digit', second: '2-digit' }).format(new Date());
            clock.textContent = value;
            authClock.textContent = value;
        }
        tick();
        setInterval(tick, 1000);
        function showState(data) {
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('clock-box').classList.remove('hidden');
            document.getElementById('employee').textContent = data.employee_name;
            const action = data.last_action === 'CLOCKED_IN' ? 'Clocked in' : data.last_action === 'CLOCKED_OUT' ? 'Clocked out' : 'No attendance action recorded yet';
            document.getElementById('last-action').textContent = data.last_action_at ? `Last action: ${action} at ${new Date(data.last_action_at).toLocaleTimeString('en-PH', { timeZone: 'Asia/Manila', hour: 'numeric', minute: '2-digit' })}` : action;
            document.getElementById('clock-in').disabled = !data.can_clock_in;
            document.getElementById('clock-out').disabled = !data.can_clock_out;
        }
        async function send(url, options) {
            const response = await fetch(url, options);
            const data = await response.json();
            if (!response.ok) throw new Error(data.detail || 'Unable to complete the request.');
            return data;
        }
        document.getElementById('login-form').addEventListener('submit', async event => {
            event.preventDefault(); error.textContent = '';
            try { showState(await send('/clock/login/', { method: 'POST', body: new FormData(event.target) })); }
            catch (exception) { error.textContent = exception.message; }
        });
        async function action(value) {
            error.textContent = '';
            try { showState(await send('/clock/action/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-CSRFToken': csrfToken }, body: `action=${value}` })); }
            catch (exception) { error.textContent = exception.message; }
        }
        document.getElementById('clock-in').onclick = () => action('CLOCK_IN');
        document.getElementById('clock-out').onclick = () => action('CLOCK_OUT');
        fetch('/clock/action/').then(response => response.ok ? response.json() : null).then(data => { if (data) showState(data); });
    </script>
</body>
</html>
