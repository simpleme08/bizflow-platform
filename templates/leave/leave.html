<!doctype html><html lang="en"><head><link rel="stylesheet" href="/static/adminlte/plugins/fontawesome-free/css/all.min.css"><link rel="stylesheet" href="/static/adminlte/dist/css/adminlte.min.css"><link rel="stylesheet" href="/static/css/custom.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Leave | BizFlow HRIS</title></head><body class="hold-transition sidebar-mini"><header class="main-header navbar navbar-expand navbar-dark navbar-navy"><span class="navbar-brand">BizFlow HRIS</span></header><main class="content-wrapper p-4"><a href="{{ workspace_url }}"><i class="fas fa-arrow-left mr-1"></i>Workspace</a><h1 class="mt-3">My leave</h1><p class="text-muted">Review balances, file a request, and follow its approval.</p><div class="row"><div class="col-lg-7"><section class="card card-outline card-primary"><div class="card-header"><h3 class="card-title">Current balances</h3></div><div class="card-body"><div class="row" id="balances">Loading balances…</div></div></section></div><div class="col-lg-5"><section class="card card-outline card-success"><div class="card-header"><h3 class="card-title">File leave</h3></div><form class="card-body" id="leaveForm">{% csrf_token %}<div class="form-group"><label>Leave type</label><select class="form-control" id="type" required></select></div><div class="form-row"><div class="form-group col-6"><label>Start date</label><input class="form-control" id="start" type="date" required></div><div class="form-group col-6"><label>End date</label><input class="form-control" id="end" type="date" required></div></div><div class="form-group"><label>Reason</label><textarea class="form-control" id="reason" rows="2" required></textarea></div><button class="btn btn-primary"><i class="fas fa-paper-plane mr-1"></i>Submit request</button><p id="message" class="text-danger mt-2 mb-0"></p></form></section></div></div><section class="card card-outline card-secondary"><div class="card-header"><h3 class="card-title">Request history</h3></div><div class="card-body table-responsive p-0"><table class="table table-hover"><thead><tr><th>Type</th><th>Dates</th><th>Days</th><th>Status</th><th>Remarks</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="text-center p-4 text-muted">Loading requests…</td></tr></tbody></table></div></section></main><script>const csrf=()=>document.cookie.split('; ').find(x=>x.startsWith('csrftoken='))?.split('=')[1]||'';const load=async()=>{const r=await fetch('/api/leave/me/');if(!r.ok){location='/login/';return}const d=await r.json();type.innerHTML=d.leave_types.map(x=>`<option value="${x.id}">${x.name}${x.is_paid?'':' (unpaid)'}</option>`).join('');balances.innerHTML=d.balances.map(x=>`<div class="col-md-4 mb-2"><div class="small-box bg-info"><div class="inner"><h3>${x.remaining}</h3><p>${x.leave_type}</p></div><div class="icon"><i class="fas fa-calendar-check"></i></div><span class="small-box-footer">${x.used} used of ${x.credits}</span></div></div>`).join('')||'<div class="col-12 text-muted">No active leave types.</div>';rows.innerHTML=d.applications.length?d.applications.map(x=>`<tr><td>${x.leave_type}</td><td>${x.start_date} to ${x.end_date}</td><td>${x.total_days}</td><td><span class="badge badge-info">${x.status}</span></td><td>${x.remarks||'—'}</td></tr>`).join(''):'<tr><td colspan="5" class="text-center p-4 text-muted">No leave requests yet.</td></tr>'};leaveForm.onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/leave/me/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({leave_type_id:type.value,start_date:start.value,end_date:end.value,reason:reason.value})});const d=await r.json();message.className=r.ok?'text-success mt-2 mb-0':'text-danger mt-2 mb-0';message.textContent=r.ok?'Request submitted for approval.':d.detail||'Unable to submit request.';if(r.ok){e.target.reset();load()}};load();</script></body></html>
