<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Employee Directory | BizFlow HRIS</title>
<link rel="stylesheet" href="/static/adminlte/plugins/fontawesome-free/css/all.min.css">
<link rel="stylesheet" href="/static/adminlte/dist/css/adminlte.min.css">
<link rel="stylesheet" href="/static/css/custom.css">
</head>
<body>
{% include "partials/app_nav.html" with active_page="people" %}
<main class="floot-shell">
<a class="floot-back" href="{{ workspace_url }}"><i class="fas fa-arrow-left"></i> Back to workspace</a>
<section class="floot-hero"><div><div class="floot-eyebrow">People operations</div><h1>Employee Directory</h1><p class="page-subtitle">People and active assignments in your organization.</p></div><span class="floot-status"><i class="fas fa-users"></i> Workforce</span></section>
<section class="floot-panel" style="padding:0"><div style="padding:18px 20px;border-bottom:1px solid var(--biz-line);display:flex;justify-content:space-between;gap:12px;align-items:center"><strong>Active workforce</strong><span class="text-muted" style="font-size:.65rem">Organization-scoped records</span></div><div style="overflow-x:auto"><table class="table table-hover mb-0"><thead><tr><th>Name</th><th>Employee #</th><th>Department</th><th>Position</th><th>Status</th><th>Shift / Client</th></tr></thead><tbody id="employees"><tr><td colspan="6" class="floot-empty">Loading employees…</td></tr></tbody></table></div></section>
</main>
<script>
async function loadEmployees(){const response=await fetch('/api/employees/');if(!response.ok){window.location.href='/login/';return}const data=await response.json();const target=document.getElementById('employees');if(!data.employees.length){target.innerHTML='<tr><td colspan="6"><div class="floot-empty"><strong style="display:block;color:var(--biz-ink);margin-bottom:5px">No employees yet</strong>Add your first employee in the admin panel to populate this directory.</div></td></tr>';return}target.innerHTML=data.employees.map(employee=>'<tr><td><strong>'+employee.name+'</strong></td><td>'+employee.employee_number+'</td><td>'+(employee.department||'—')+'</td><td>'+(employee.position||'—')+'</td><td><span class="floot-status">'+(employee.employment_type||'—')+'</span></td><td>'+(employee.assignments.length?employee.assignments.map(a=>a.shift+(a.client?' / '+a.client:'')).join('; '):'—')+'</td></tr>').join('')}
loadEmployees();
</script>
</body></html>
