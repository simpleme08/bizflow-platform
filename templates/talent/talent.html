<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talent lifecycle | BizFlow HRIS</title>
<link rel="stylesheet" href="/static/adminlte/plugins/fontawesome-free/css/all.min.css"><link rel="stylesheet" href="/static/adminlte/dist/css/adminlte.min.css"><link rel="stylesheet" href="/static/css/custom.css"></head>
<body>
<header class="floot-topbar"><div class="floot-topbar-inner"><a class="floot-brand" href="/workspace/"><span class="floot-brand-mark"><i class="fas fa-users"></i></span>BizFlow</a><span style="flex:1"></span><a href="/workspace/" style="color:#dce8f5;font-size:.72rem;font-weight:800;text-decoration:none">Workspace</a></div></header>
<main class="floot-shell">
<a class="floot-back" href="/workspace/"><i class="fas fa-arrow-left"></i> Back to workspace</a>
<section class="floot-hero"><div><div class="floot-eyebrow">People lifecycle</div><h1>Talent lifecycle</h1><p class="page-subtitle">A connected view of recruiting, performance, benefits, and employee transitions.</p></div><span class="floot-status"><i class="fas fa-project-diagram"></i> Lifecycle</span></section>
<section class="floot-grid-3">
<article class="floot-stat"><span class="floot-stat-label">Open jobs</span><strong class="floot-stat-value" id="jobs">—</strong><ul class="floot-list" id="applications" style="margin-top:15px;padding:0;list-style:none"></ul></article>
<article class="floot-stat"><span class="floot-stat-label">Review cycles</span><strong class="floot-stat-value" id="cycles">—</strong><ul class="floot-list" id="goals" style="margin-top:15px;padding:0;list-style:none"></ul></article>
<article class="floot-stat"><span class="floot-stat-label">Active benefit plans</span><strong class="floot-stat-value" id="plans">—</strong><ul class="floot-list" id="enrollments" style="margin-top:15px;padding:0;list-style:none"></ul></article>
<article class="floot-stat"><span class="floot-stat-label">Employee transitions</span><strong class="floot-stat-value" id="offboarding">—</strong><ul class="floot-list" id="exits" style="margin-top:15px;padding:0;list-style:none"></ul></article>
</section>
</main>
<script>
const render=(id,values,format)=>document.getElementById(id).innerHTML=values.length?values.slice(0,4).map(v=>'<li class="floot-list-item">'+format(v)+'</li>').join(''):'<li class="floot-list-item text-muted">No records yet.</li>';
const load=async()=>{try{const [r,p,b,o]=await Promise.all(['/api/recruiting/','/api/performance/','/api/benefits/','/api/offboarding/'].map(x=>fetch(x).then(x=>x.json())));document.getElementById('jobs').textContent=r.jobs.length;render('applications',r.applications,x=>x.candidate+' · '+x.job+' <strong>'+x.stage+'</strong>');document.getElementById('cycles').textContent=p.cycles.length;render('goals',p.goals,x=>x.employee+' · '+x.title+' ('+x.progress+'%)');document.getElementById('plans').textContent=b.plans.filter(x=>x.is_active).length;render('enrollments',b.enrollments,x=>x.employee+' · '+x.plan);document.getElementById('offboarding').textContent=o.records.length;render('exits',o.records,x=>x.employee+' · '+x.last_working_day+' ('+x.status+')')}catch(e){document.querySelectorAll('.floot-stat-value').forEach(x=>x.textContent='—')}};load();
</script>
</body></html>
